server.port=8082
server.address=127.0.0.1
spring.application.name=msequipamento
management.endpoints.web.exposure.include=health,info
eureka.client.service-url.defaultZone=${EUREKA_URL:http://127.0.0.1:8761/eureka/}
eureka.instance.hostname=localhost
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/msequipamento?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:msequipamento}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
