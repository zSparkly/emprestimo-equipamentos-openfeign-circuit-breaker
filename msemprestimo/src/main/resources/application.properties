server.port=8083
server.address=127.0.0.1
spring.application.name=msemprestimo
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
eureka.client.service-url.defaultZone=${EUREKA_URL:http://127.0.0.1:8761/eureka/}
eureka.instance.hostname=localhost
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/msemprestimo?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:msemprestimo}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.loadbalancer.retry.enabled=false

# Apenas a alteração remota de condição utiliza este circuito.
resilience4j.circuitbreaker.instances.alterarCondicao.slidingWindowSize=5
resilience4j.circuitbreaker.instances.alterarCondicao.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.alterarCondicao.failureRateThreshold=50
resilience4j.circuitbreaker.instances.alterarCondicao.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.alterarCondicao.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.alterarCondicao.ignoreExceptions[0]=br.edu.msemprestimo.EquipamentoIntegracao$ErroNegocio
resilience4j.circuitbreaker.instances.alterarCondicao.eventConsumerBufferSize=100
